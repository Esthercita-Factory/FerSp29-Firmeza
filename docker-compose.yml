services:
  firmeza-postgres:
    image: postgres:16-alpine
    container_name: firmeza_db_postgres
    restart: always
    environment:
      POSTGRES_DB: firmeza_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - firmeza_pgdata:/var/lib/postgresql/data
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d firmeza_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  firmeza_pgdata:
